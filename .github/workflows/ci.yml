name: Container CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build application image
        run: docker build -t aws-deployment-recovery:0.1.0 .

      - name: Start container
        id: start
        run: docker run -d --name recovery-app -p 127.0.0.1:8000:8000 aws-deployment-recovery:0.1.0

      - name: Verify health and version
        shell: bash
        run: |
          for attempt in {1..10}; do
            if python check_health.py --expected-version 0.1.0; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Show container logs
        if: always() && steps.start.outcome == 'success'
        run: docker logs recovery-app